# One group per design decision (plan section 10). `smem-eval --ablation-group evict` runs every row
# of a group with the same base config; each row is a set of dotted overrides.
base: configs/default.yaml
groups:
  # Kept: the one comparison that matters for a working system -- does the swap rule beat the
  # simplest eviction, and is the Hawkes prior worth keeping (drop the code if not). LRU behaves like
  # FIFO in a stream with no re-access, so it is not run separately.
  evict:
    swap:               {evict.policy: swap}
    swap_no_hawkes:     {evict.policy: swap_no_hawkes}
    fifo:               {evict.policy: fifo}
# Removed on 2026-09-13: the write / consolidation / retrieval / packing / constrained_decoding groups,
# the utility_heuristic and random eviction arms, and the store- and read-budget sweeps (~50 runs).
# The diagnostics showed the losses are upstream of every one of those switches: extraction drops ~27%
# of look-up-able answers outright, fact values are lossy ("my go-to is 3:1" -> "experimenting with
# ratios"), and the free-tier answerer returns empty completions under load. Until those are fixed,
# comparing packing algorithms or read budgets would be measuring noise. Reference point that IS run:
# the system with no store budget at all (omit --store-budget), which is the pipeline's own ceiling.

# Dev calibration of the sieve's lowest admission threshold (ingest only, no API; 20 answerable dev
# questions, B=0.03, evict=swap, real bge-m3). Judged by what each setting KEEPS, not by fill:
#
#   sieve_min_threshold   evidence write   evidence survival   admitted/candidates   evictions/q
#   auto (0.0)                 0.33              0.31                 28%                 0
#   1e-3                       0.70              0.63                 43%                77
#   3e-4                       0.89              0.74                 47%               337   <- chosen
#   1e-4                       0.93              0.75                 48%               632
#
# The automatic estimate (max singleton gain per token) was set by one hub entry similar to every
# filler session, so the bar rejected two thirds of the evidence while the store sat 20% empty and
# eviction never ran. Below 3e-4 the admitted fraction plateaus at ~47%: the half that is rejected
# is rejected by near-zero coverage gain, not by the bar. 1e-4 buys +4 points of write rate for twice
# the swap churn and no survival gain. Frozen at 3e-4 for every ablation and for the test split.
calibration:
  sieve_min_threshold: 0.0003
