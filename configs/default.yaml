# Full system. Model names are only used with --backend llm.
name: default
budget:
  store_tokens: 1000000000   # overridden by --store-budget (fraction of history tokens, or absolute)
  read_tokens: 2000
  consolidate_every: 5
write:
  policy: sieve
  validity_chain: true
  sieve_eps: 1.0
  hysteresis_gamma: 0.1
evict:
  policy: swap
  hawkes_alpha: 0.5
  hawkes_beta: 0.03
consolidation:
  policy: redundancy
read:
  retrieval: two_hop
  packing: budgeted_greedy
  tau_abs: 0.3
extract:
  backend: llm
  constrained_decoding: true
  cache_dir: .cache/extract
models:
  embedder: BAAI/bge-m3
  extract_model: Qwen/Qwen3-8B-AWQ
  extract_base_url: http://localhost:8000/v1
  answer_model: gpt-4.1-mini
  judge_model: gpt-4.1-mini
  nli_model: cross-encoder/nli-deberta-v3-base
  llm_cache_dir: .cache/llm
