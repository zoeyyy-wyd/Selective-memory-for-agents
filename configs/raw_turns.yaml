# Final configuration: default.yaml plus verbatim turns (docs/results.md, docs/accuracy-plan.md).
# dev100 59 (facts only) -> 71 (raw turns behind packed entries, 4k) -> 76-77 (raw turns also indexed, 6k);
# test200 0.82. Raw turns are second-tier entries charged to budget.store_tokens: extracted entries are
# selected exactly as without them, raw turns take the budget that is left and are evicted first.
extends: default.yaml
write:
  raw_turns: true
budget:
  raw_tokens: 6000
read:
  k_turns: 30
extract:
  prompt_version: v3-detail
consolidation:
  policy: no_consolidation
models:
  nli_device: cpu    # the NLI model is only needed by consolidation; keep it off the shared GPU
