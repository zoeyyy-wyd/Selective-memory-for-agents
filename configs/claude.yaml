# Same system as default.yaml, with answering on Claude. Extraction, embeddings and the NLI check
# stay on the local L4 (Anthropic has no embedding endpoint, and Qwen3-8B extraction is free).
#
#   vllm serve Qwen/Qwen3-8B-AWQ --port 8000 --max-model-len 12288 --gpu-memory-utilization 0.9
#   smem-extract --split dev --workers 32
#   smem-eval --split dev --config configs/claude.yaml --backend llm --judge llm ...
#
# The judge stays on gpt-4.1-mini / gpt-4o on purpose: judge.py is a port of the official
# LongMemEval evaluate_qa.py, and changing the judge makes the numbers incomparable with published
# LongMemEval results. Use Claude as a *second* judge for an agreement check, not as the primary.
name: claude
budget:
  store_tokens: 1000000000   # overridden by --store-budget
  read_tokens: 2000
  consolidate_every: 5
write:
  policy: sieve
  validity_chain: true
  sieve_eps: 1.0
  hysteresis_gamma: 0.1
evict:
  policy: swap
  hawkes_alpha: 0.5
  hawkes_beta: 0.03
consolidation:
  policy: redundancy
read:
  retrieval: two_hop
  packing: budgeted_greedy
  tau_abs: 0.3
extract:
  backend: llm
  constrained_decoding: true
  max_turn_tokens: 2000
  cache_dir: .cache/extract
anthropic:
  # Thinking off: the experiment measures whether the memory system surfaced the right entries, and
  # a reader that reasons around a retrieval gap would mask exactly the differences Figure 1 is for.
  # On Opus 5 use thinking: adaptive + effort: low instead -- disabling it there has known failure
  # modes (tool calls written into visible text, <thinking> tag leakage).
  thinking: "off"
  effort: null
models:
  embedder: BAAI/bge-m3
  extract_model: Qwen/Qwen3-8B-AWQ
  extract_base_url: http://localhost:8000/v1
  answer_model: claude-sonnet-5
  answer_provider: anthropic
  judge_model: gpt-4o                # official LongMemEval judge, dev and test alike; direct api.openai.com
  judge_provider: openai
  nli_model: cross-encoder/nli-deberta-v3-base
  llm_cache_dir: .cache/llm
  schema_mode: response_format
  extract_extra_body:
    chat_template_kwargs: {enable_thinking: false}
